services:
  db:
    image: pgvector/pgvector:pg17
    container_name: citefirst-db
    environment:
      POSTGRES_USER: citefirst
      POSTGRES_PASSWORD: citefirst
      POSTGRES_DB: citefirst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citefirst -d citefirst"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
