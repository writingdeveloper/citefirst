  # ──────────────────────────────────────────────────────────────────────────
  # 동작 질문 — SHOW 로는 답이 안 나온다. 실제로 실행해봐야 아는 것들이다.
  # 설정 기본값만 모으면 코퍼스가 "표 조회"로 퇴화하는데, 이런 시스템이 실제로 투입되는 문서는
  # 정책·계약서처럼 **규칙과 예외**가 본문에 흩어져 있는 종류다. 그쪽을 흉내 내는 질문이다.

  - id: q043
    question: If I empty a table and then change my mind before committing, do the rows come back?
    expected_answer: "Yes. TRUNCATE is transaction-safe with respect to table data — rolling back the surrounding transaction restores the rows. (A RESTART IDENTITY sequence restart is rolled back too, except for the effects of other sequence operations done in between.)"
    verified_by: "CREATE TEMP TABLE t_trunc(i int); INSERT 5행; BEGIN; TRUNCATE t_trunc; ROLLBACK; SELECT count(*) → 5"
    verified: true
    trap: "다른 DB(MySQL/Oracle)에서는 TRUNCATE 가 암묵 커밋이라 반대로 기억하기 쉽다"
    gold:
      source_path_contains: sql-truncate
      must_contain: ["rolled back"]

  - id: q044
    question: Can creating a new database be wrapped in BEGIN and COMMIT so I can undo it?
    expected_answer: "No. CREATE DATABASE cannot be executed inside a transaction block."
    verified_by: "BEGIN; CREATE DATABASE probe_db; → ERROR: CREATE DATABASE cannot run inside a transaction block"
    verified: true
    trap: "q008(VACUUM) 과 같은 형태의 질문이라 검색이 그쪽으로 샌다"
    gold:
      source_path_contains: sql-createdatabase
      must_contain: ["transaction block"]

  - id: q045
    question: Rebuilding an index without blocking writes — can that be run inside a transaction?
    expected_answer: "No. REINDEX CONCURRENTLY cannot be run inside a transaction block."
    verified_by: "BEGIN; REINDEX INDEX CONCURRENTLY t_rx_i; → ERROR: REINDEX CONCURRENTLY cannot run inside a transaction block"
    verified: true
    trap: "q013(CREATE INDEX CONCURRENTLY)과 사실상 같은 제약이라 두 문서가 서로 걸린다"
    gold:
      source_path_contains: sql-reindex
      must_contain: ["CONCURRENTLY", "transaction block"]

  - id: q046
    question: Can I speed a dump up with several worker processes no matter which output format I picked?
    expected_answer: "No. Parallel dump (-j / --jobs) can only be used with the directory format."
    verified_by: "pg_dump -Fc -j2 → error: parallel backup only supported by the directory format / pg_dump -Fd -j2 → 성공"
    verified: true
    trap: "custom 포맷도 아카이브라서 병렬이 될 것처럼 읽힌다"
    gold:
      source_path_contains: app-pgdump
      must_contain: ["jobs", "directory"]
